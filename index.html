<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Negocio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            padding-bottom: 25px;
        }

        .header-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-top: -45px;
            object-fit: cover;
            background: #fff;
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 10px;
            color: #1a1a1a;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            padding: 0 15px;
        }

        .info-box {
            background: #f8f9fa;
            margin: 0 20px 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #444;
            text-align: left;
        }

        .info-box p {
            margin-bottom: 5px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            color: #fff;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-whatsapp { background-color: #25D366; }
        .btn-location { background-color: #EA4335; }
        .btn-menu     { background-color: #007bff; }
        .btn-insta    { background-color: #E1306C; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Imagen de Portada -->
        <img src="https://via.placeholder.com/400x180" alt="Portada" class="header-img">
        
        <!-- Logo o Foto de Perfil -->
        <img src="https://via.placeholder.com/90" alt="Logo" class="avatar">

        <h1>Nombre del Negocio</h1>
        <p class="subtitle">Descripción corta de tu producto o servicio.</p>

        <!-- Información Útil -->
        <div class="info-box">
            <p><strong>📍 Dirección:</strong> Calle 123 #45-67, Ciudad</p>
            <p><strong>🕒 Horario:</strong> Lun - Sáb: 8:00 AM - 7:00 PM</p>
        </div>

        <!-- Enlaces Rápidos -->
        <div class="buttons">
            <a href="https://wa.me/573000000000" class="btn btn-whatsapp" target="_blank">💬 Contactar por WhatsApp</a>
            <a href="https://maps.google.com" class="btn btn-location" target="_blank">🗺️ Cómo llegar (Google Maps)</a>
            <a href="#" class="btn btn-menu">📜 Ver Menú / Catálogo</a>
            <a href="https://instagram.com" class="btn btn-insta" target="_blank">📸 Síguenos en Instagram</a>
        </div>
    </div>

</body>
</html>
